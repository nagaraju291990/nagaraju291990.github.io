<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>MMTS STATUS</title>

	<script src="js/config.js"></script>
	
	<script src="js/jquery.js"></script>
	<script src="js/jquery-ui.js"></script>
	<script type="text/javascript" src="js/FileSaver.js"></script>
	<!-- <script type="text/javascript" src="js/validation.js"></script> -->
	<link rel="stylesheet" type="text/css" href="css/styles.css"/>
	<script type="text/javascript" src="js/main.js"></script>

<style>
/* =========================================================
   MMTS STATUS — Framework-free responsive UI
   Pure CSS. No Bootstrap / Tailwind dependency.
   Existing HTML, IDs and JavaScript behavior are preserved.
   ========================================================= */

:root {
    --bg: #f4f7fb;
    --surface: #ffffff;
    --surface-soft: #f8fafc;
    --border: #d9e1ea;
    --text: #172033;
    --muted: #64748b;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --secondary: #475569;
    --secondary-dark: #334155;
    --radius: 12px;
    --shadow: 0 8px 28px rgba(15, 23, 42, .08);
    --focus: 0 0 0 3px rgba(37, 99, 235, .16);
}

*,
*::before,
*::after {
    box-sizing: border-box;
}

html {
    width: 100%;
    min-height: 100%;
    -webkit-text-size-adjust: 100%;
}

body {
    width: 100%;
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

/* Main wrapper */
.container[style*="width: 100%"] {
    width: 100% !important;
    max-width: 100% !important;
    margin: 0 auto;
    padding: clamp(10px, 2vw, 24px);
}

/* Hidden existing top area remains hidden exactly as before */
form#upload {
    width: 100%;
    margin: 0;
}

/* Generic controls */
.btn,
.form-select,
input[type="file"] {
    font: inherit;
}

.btn {
    appearance: none;
    border: 1px solid transparent;
    min-height: 44px;
    padding: 10px 16px;
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    font-weight: 600;
    line-height: 1.2;
    cursor: pointer;
    transition:
        background-color .18s ease,
        border-color .18s ease,
        color .18s ease,
        box-shadow .18s ease,
        transform .18s ease;
}

.btn:hover {
    transform: translateY(-1px);
}

.btn:active {
    transform: translateY(0);
}

.btn:focus-visible,
.form-select:focus-visible,
input[type="file"]:focus-visible {
    outline: none;
    box-shadow: var(--focus);
}

.btn-outline-primary {
    color: var(--primary);
    background: var(--surface);
    border-color: var(--primary);
}

.btn-outline-primary:hover {
    color: #fff;
    background: var(--primary);
}

.btn-secondary {
    color: #fff;
    background: var(--secondary);
    border-color: var(--secondary);
}

.btn-secondary:hover {
    background: var(--secondary-dark);
    border-color: var(--secondary-dark);
}

.btn-primary {
    color: #fff;
    background: var(--primary);
    border-color: var(--primary);
}

.btn-primary:hover {
    background: var(--primary-dark);
    border-color: var(--primary-dark);
}

.form-select {
    appearance: auto;
    width: 100%;
    min-height: 44px;
    padding: 9px 38px 9px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
}

.form-select:hover {
    border-color: #b9c5d4;
}

/* File input */
input[type="file"] {
    width: 100%;
    min-width: 0;
    color: var(--muted);
    cursor: pointer;
}

input[type="file"]::file-selector-button {
    margin-right: 10px;
    padding: 8px 12px;
    border: 0;
    border-radius: 7px;
    background: #eef3ff;
    color: var(--primary);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
}

/* Upload controls */
form#upload .btn-group {
    display: grid !important;
    grid-template-columns:
        minmax(190px, 1.25fr)
        minmax(160px, 1fr)
        minmax(160px, .9fr)
        auto;
    gap: 10px;
    width: 100% !important;
    align-items: stretch;
}

form#upload label.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-width: 0;
    overflow: hidden;
}

/* Override inline widths without changing HTML */
#discourseType,
#anaphora_type,
#font-size {
    width: 100% !important;
}

/* Action toolbar */
#buttons {
    display: grid !important;
    grid-template-columns:
        repeat(3, minmax(150px, 1fr))
        minmax(100px, .7fr);
    gap: 10px;
    width: 100% !important;
    max-width: 100% !important;
    margin-top: 12px;
}

#buttons > * {
    width: 100% !important;
    min-width: 0;
}

#buttons .btn {
    white-space: normal;
}

/* Main content panel */
.row[style*="height: 100%"] {
    display: block;
    width: 100%;
    height: auto !important;
    min-height: calc(100vh - 150px);
    margin: 16px 0 0 !important;
    padding: 12px !important;
    overflow: hidden !important;
    border: 1px solid var(--border) !important;
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
}

/* Existing column classes are neutralized without Bootstrap */
.row > [class*="col-"] {
    width: 100% !important;
    max-width: 100% !important;
    float: none !important;
}

/* Table wrapper */
#statusTable {
    display: block;
    width: 100% !important;
    max-width: 100% !important;
    height: auto;
    max-height: none !important;
    margin-top: 0 !important;
    overflow-x: hidden;
    overflow-y: auto;
}

/* Dynamically generated table */
#statusTable table {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    margin: 0;
    border-collapse: separate;
    border-spacing: 0;
    background: var(--surface);
    table-layout: fixed;
}

#statusTable th,
#statusTable td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: middle;
}

#statusTable th {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--surface-soft);
    color: #334155;
    font-weight: 700;
    white-space: nowrap;
}

#statusTable tbody tr {
    transition: background-color .15s ease;
}

#statusTable tbody tr:hover {
    background: #f8fbff;
}

/* =========================================================
   Tablet
   ========================================================= */
@media (max-width: 900px) {
    form#upload .btn-group {
        grid-template-columns: 1fr 1fr;
    }

    #buttons {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

/* =========================================================
   Mobile
   ========================================================= */
@media (max-width: 600px) {
    body {
        font-size: 14px;
    }

    .container[style*="width: 100%"] {
        padding: 8px;
    }

    form#upload .btn-group {
        grid-template-columns: 1fr;
        gap: 8px;
    }

    form#upload label.btn,
    .form-select,
    .btn {
        min-height: 46px;
    }

    #buttons {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 8px;
    }

    #buttons #font-size {
        grid-column: 1 / -1;
    }

    .row[style*="height: 100%"] {
        min-height: calc(100vh - 100px);
        margin-top: 10px !important;
        padding: 7px !important;
        border-radius: 10px;
    }

    #statusTable th,
    #statusTable td {
        padding: 10px 11px;
    }
}

/* =========================================================
   Small phones
   ========================================================= */
@media (max-width: 380px) {
    #buttons {
        grid-template-columns: 1fr;
    }

    #buttons #font-size {
        grid-column: auto;
    }

    .container[style*="width: 100%"] {
        padding: 6px;
    }

    .row[style*="height: 100%"] {
        padding: 5px !important;
    }
}

/* Touch devices */
@media (hover: none) {
    .btn:hover {
        transform: none;
    }

    #statusTable tbody tr:hover {
        background: transparent;
    }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
    }
}

/* =========================================================
   Compact mobile status table
   Keep the table as a real table and fit all columns on
   narrow screens. No horizontal scrolling / no cards.
   ========================================================= */

#statusTable {
    width: 100% !important;
    max-width: 100% !important;
    overflow-x: hidden !important;
}

#statusTable table {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    table-layout: fixed;
}

/* Prevent long station names from expanding columns */
#statusTable th,
#statusTable td {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Desktop proportions */
#statusTable th:nth-child(1),
#statusTable td:nth-child(1) { width: 7%; }

#statusTable th:nth-child(2),
#statusTable td:nth-child(2) { width: 12%; }

#statusTable th:nth-child(3),
#statusTable td:nth-child(3) { width: 17%; }

#statusTable th:nth-child(4),
#statusTable td:nth-child(4) { width: 17%; }

#statusTable th:nth-child(5),
#statusTable td:nth-child(5) { width: 17%; }

#statusTable th:nth-child(6),
#statusTable td:nth-child(6) { width: 15%; }

#statusTable th:nth-child(7),
#statusTable td:nth-child(7) { width: 15%; }

@media (max-width: 600px) {
    #statusTable {
        overflow-x: hidden !important;
        font-size: 11px;
    }

    #statusTable table {
        width: 100% !important;
        min-width: 0 !important;
        table-layout: fixed !important;
    }

    #statusTable th,
    #statusTable td {
        padding: 9px 3px !important;
        font-size: 10px;
        line-height: 1.2;
        white-space: nowrap !important;
        overflow: hidden;
        text-overflow: ellipsis;
        vertical-align: middle;
    }

    #statusTable th {
        font-size: 9px;
        letter-spacing: .02em;
        text-align: center;
        padding: 9px 2px !important;
    }

    #statusTable td {
        text-align: center;
    }

    /* Give more space to the useful route/station columns */
    #statusTable th:nth-child(1),
    #statusTable td:nth-child(1) { width: 7%; }

    #statusTable th:nth-child(2),
    #statusTable td:nth-child(2) { width: 13%; }

    #statusTable th:nth-child(3),
    #statusTable td:nth-child(3) { width: 16%; }

    #statusTable th:nth-child(4),
    #statusTable td:nth-child(4) { width: 17%; }

    #statusTable th:nth-child(5),
    #statusTable td:nth-child(5) { width: 17%; }

    #statusTable th:nth-child(6),
    #statusTable td:nth-child(6) { width: 15%; }

    #statusTable th:nth-child(7),
    #statusTable td:nth-child(7) { width: 15%; }
}

@media (max-width: 380px) {
    #statusTable {
        font-size: 10px;
    }

    #statusTable th,
    #statusTable td {
        padding: 8px 2px !important;
        font-size: 9px;
    }

    #statusTable th {
        font-size: 8px;
    }
}

</style>

</head>
<body>
	<div class="container" style="width: 100% !important;">
		<div id="" class="col-sm-12 col-md-12 col-lg-12 col-xl-12 col-xxl-12" style="display:none;margin-top: 0 !important;">

			<form class="form-inline" id="upload" method="post" enctype="multipart/form-data">
				<div class="btn-group col-sm-12 col-md-12 col-lg-12 col-xl-12 col-xxl-12 flex-wrap" role="group" aria-label="Basic example">
					<label class="btn btn-outline-primary" for="my-file-selector" data-bs-title="Choose File" data-bs-placement="bottom" data-bs-toggle="tooltip">
						<!--<input accept=".doc,.rtf,.docx,.pdf,text/plain" type="file" id="file" name="inputfile" multiple/>-->
						<input accept="text/plain,.doc" type="file" id="file" name="inputfile" onchange="startRead(this)" multiple>
					</label>
					<!-- <button class="btn btn-outline-secondary">H</button>
					<button class="btn btn-outline-secondary">H</button> -->
					<select class="form-select" style="width: 20%;" id="discourseType" data-bs-title="Choose Annotation type" data-bs-placement="bottom" data-bs-toggle="tooltip">
						<option value="anaphora">Anaphora</option>
						<option value="connective">Connectives</option>
					</select>
					<select class="form-select" style="width: 15%;" id="anaphora_type" data-bs-title="Choose Relation type" data-bs-placement="bottom" data-bs-toggle="tooltip">
						<!-- <option value="anaphora_c">Anaphora_C</option>
						<option value="anaphora_rc">Anaphora_RC</option> -->
					</select>
					<button type="button" class="btn btn-outline-primary" id="clearBtn">Clear</button>
				</div>
			</form>
			<div id="buttons" class="btn-group flex-wrap col-sm-9 col-md-9 col-lg-9 col-xl-9 col-xxl-9" role="group" aria-label="Toolbar">
				<button type="button" id="submit" class="btn btn-secondary" data-bs-title="Use shortcut Ctrl+K to submit anaphora" data-bs-placement="bottom" data-bs-toggle="tooltip">Submit Anaphora</button>
				<!-- <button type="button" id="undoButton" class="btn btn-danger">Undo</button>  -->
				<button type="button" id="download" class="btn btn-secondary">Download Annotations</button>
				<button type="button" id="viewXML" class="btn btn-secondary">View XML</button>
				<!-- <button type="button" id="view" class="btn btn-secondary">View Annotations</button> -->
				<button type="button" id="save" class="btn btn-primary" data-bs-title="Use shortcut Ctrl+S to save current session" data-bs-placement="bottom" data-bs-toggle="tooltip">Save</button>
				<select style="width: 15%;" class="form-select" id="font-size" onchange="updateFontSize();">

				</select>
			</div>
		</div>

		<div class="row" style="height: 100%; overflow-y: auto; border: 1px solid #fff; padding: 10px;">
			<div style="margin-top: 3%;max-width: 100%; max-height: 800px; overflow: auto;" class="col-xs-9 col-sm-9 col-md-9 col-lg-9 col-xl-9 col-xxl-9 table-responsive table-responsive-sm table-responsive-md table-responsive-lg table-responsive-xl table-responsive-xxl" id="statusTable">
				
			</div>
		
			
		</div>
	</div>
</body>
</html>
